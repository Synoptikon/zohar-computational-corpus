name: gate002-reproducibility

# GATE-002 reproducibility execution trigger/audit baseline.
on:
  push:
    paths:
      - '.github/workflows/gate002-reproducibility.yml'
      - 'scripts/normalize_corpus.py'
      - 'scripts/audit_normalized_offsets.py'
      - 'scripts/segment_corpus.py'
      - 'scripts/audit_segments.py'
      - 'scripts/verify_segmentation_reproducibility.py'
      - 'tests/**'
      - 'src/**'
      - 'data/raw/zohar/wikisource/**'
      - 'data/sources/zohar_primary_wikisource.json'
      - 'data/analysis/segmentation_rules_v0.1.md'
      - 'data/analysis/segment_contract_v0.1.md'
  pull_request:
    paths:
      - '.github/workflows/gate002-reproducibility.yml'
      - 'scripts/normalize_corpus.py'
      - 'scripts/audit_normalized_offsets.py'
      - 'scripts/segment_corpus.py'
      - 'scripts/audit_segments.py'
      - 'scripts/verify_segmentation_reproducibility.py'
      - 'tests/**'
      - 'src/**'
      - 'data/raw/zohar/wikisource/**'
      - 'data/sources/zohar_primary_wikisource.json'
      - 'data/analysis/segmentation_rules_v0.1.md'
      - 'data/analysis/segment_contract_v0.1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate002:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Test implementation
        run: python -m pytest

      - name: Normalize corpus
        run: python scripts/normalize_corpus.py

      - name: Audit normalized offsets
        run: >-
          python scripts/audit_normalized_offsets.py
          --input-dir data/normalized/zohar/wikisource
          --output artifacts/audit_normalized_offsets.json

      - name: Segment corpus run 1
        run: >-
          python scripts/segment_corpus.py
          --input-dir data/normalized/zohar/wikisource
          --output-dir data/segments/zohar/wikisource
          --source-manifest data/sources/zohar_primary_wikisource.json
          --repo-root .

      - name: Audit SID segments run 1
        run: >-
          python scripts/audit_segments.py
          --input-dir data/segments/zohar/wikisource
          --output artifacts/audit_segments_run1.json

      - name: Segment corpus run 2
        run: >-
          python scripts/segment_corpus.py
          --input-dir data/normalized/zohar/wikisource
          --output-dir artifacts/segmentation-run2
          --source-manifest data/sources/zohar_primary_wikisource.json
          --repo-root .

      - name: Audit SID segments run 2
        run: >-
          python scripts/audit_segments.py
          --input-dir artifacts/segmentation-run2
          --output artifacts/audit_segments_run2.json

      - name: Verify preservation and byte reproducibility
        run: >-
          python scripts/verify_segmentation_reproducibility.py
          --normalized-dir data/normalized/zohar/wikisource
          --run1-dir data/segments/zohar/wikisource
          --run2-dir artifacts/segmentation-run2
          --output artifacts/segment_reproducibility.json

      - name: Emit GATE-002 execution manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          audit = json.loads(Path('artifacts/segment_reproducibility.json').read_text(encoding='utf-8'))
          manifest = {
              'gate': 'GATE-002',
              'status': audit['status'],
              'commit': '${{ github.sha }}',
              'workflow': '${{ github.workflow }}',
              'run_id': '${{ github.run_id }}',
              'normalized_offset_audit': 'artifacts/audit_normalized_offsets.json',
              'segment_audit_run1': 'artifacts/audit_segments_run1.json',
              'segment_audit_run2': 'artifacts/audit_segments_run2.json',
              'reproducibility_audit': 'artifacts/segment_reproducibility.json',
              'run1_segment_directory': 'data/segments/zohar/wikisource',
              'run2_segment_directory': 'artifacts/segmentation-run2',
              'evidence_sha256': sha256(Path('artifacts/segment_reproducibility.json')),
          }
          Path('artifacts/gate002_execution_manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload GATE-002 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zohar-gate002-${{ github.sha }}
          path: |
            artifacts/
            data/normalized/zohar/wikisource/normalized_manifest.json
            data/segments/zohar/wikisource/
          if-no-files-found: error
          retention-days: 30
