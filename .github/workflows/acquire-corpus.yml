name: acquire-corpus

on:
  push:
    paths:
      - '.github/workflows/acquire-corpus.yml'
      - 'scripts/acquire_wikisource_zohar.py'
      - 'scripts/validate_corpus_snapshot.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-001-acquire
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire immutable RAW snapshot
        run: python scripts/acquire_wikisource_zohar.py --output data/raw/zohar/wikisource

      - name: Validate snapshot integrity and structural sample
        run: python scripts/validate_corpus_snapshot.py data/raw/zohar/wikisource

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Acquisition mutates the working tree. Do not rebase while those
          # changes are unstaged: Git refuses to rebase a dirty worktree.
          # Instead, reconcile HEAD/index with the current remote first while
          # preserving the acquired RAW files in the working tree. Only the RAW
          # snapshot is staged and committed below.
          git fetch origin main
          git reset --mixed origin/main

          git add data/raw/zohar/wikisource
          if git diff --cached --quiet; then
            echo 'RAW snapshot unchanged; nothing to commit.'
            exit 0
          fi

          git commit -m 'data: add verified Wikisource RAW snapshot'
          git push origin HEAD:main

          # This workflow is the execution evidence source for GATE-001. The
          # immutable snapshot and its manifest are committed only after the
          # validation step above succeeds.
