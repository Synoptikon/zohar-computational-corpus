name: acquire-corpus

on:
  push:
    paths:
      - '.github/workflows/acquire-corpus.yml'
      - 'scripts/acquire_wikisource_zohar.py'
      - 'scripts/validate_corpus_snapshot.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire immutable RAW snapshot
        run: python scripts/acquire_wikisource_zohar.py --output data/raw/zohar/wikisource

      - name: Validate snapshot integrity and structural sample
        run: python scripts/validate_corpus_snapshot.py data/raw/zohar/wikisource

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/zohar/wikisource
          git diff --cached --quiet || git commit -m 'data: add verified Wikisource RAW snapshot'
          git push
