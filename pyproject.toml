[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zohar-computational-corpus"
version = "0.1.0"
description = "Reproducible and auditable computational research framework for the Zohar corpus"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/zohar_corpus"]
